# Build the documentation site (MkDocs Material) + the Doxygen C++ API reference
# and publish them to GitHub Pages. Requires: repo public (or GitHub Pro) and
# Settings -> Pages -> Source = "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen + Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Build the C++ API reference (Doxygen)
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git
          { cat Doxyfile;
            echo "HTML_EXTRA_STYLESHEET = doxygen-awesome-css/doxygen-awesome.css doxygen-awesome-css/doxygen-awesome-sidebar-only.css";
          } | doxygen -

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build the docs site (MkDocs Material)
        run: |
          set -euxo pipefail
          pip install mkdocs-material
          mkdocs build            # outputs to ./site

      - name: Fold the API reference into the site (/api)
        run: |
          mkdir -p site/api
          cp -r build/doxygen/html/* site/api/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
